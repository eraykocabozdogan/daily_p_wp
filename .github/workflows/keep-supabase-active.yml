name: Keep Supabase active

on:
  schedule:
    - cron: "17 4,12,20 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call keepalive probe
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://pbqwhxtmkmxzarvnsesu.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --retry 3 \
              --retry-all-errors \
              --request POST \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "${SUPABASE_URL}/rest/v1/rpc/keepalive_probe"
          )"

          test "$status" = "200"
          test "$(tr -d '[:space:]' < "$response_file")" = "true"
